[project]
name = "kakaotalk-mcp"
version = "0.1.0"
description = "MCP server for reading and sending KakaoTalk messages from Claude Code on macOS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "kemy-ai" },
]
keywords = ["mcp", "claude", "kakaotalk", "automation", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastmcp>=3.2.4",
]

[project.urls]
Homepage = "https://github.com/kemy-ai/kakaotalk-mcp"
Issues = "https://github.com/kemy-ai/kakaotalk-mcp/issues"

[project.scripts]
kakaotalk-mcp = "kakaotalk_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kakaotalk_mcp"]
